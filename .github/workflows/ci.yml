# CI do backend: a cada push ou pull request, roda as verificações abaixo.
# Se alguma falhar, o GitHub marca o commit com um X vermelho.
name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes (Django + PostgreSQL)
    runs-on: ubuntu-latest

    # Banco PostgreSQL descartável, só para os testes.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: corelist
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_NAME: corelist
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: '5432'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Migrações em dia (nenhum model sem migração)
        run: python manage.py makemigrations --check --dry-run

      - name: Testes automáticos
        run: python manage.py test --verbosity 2

      - name: Configuração de produção válida
        env:
          DEBUG: 'False'
          SECRET_KEY: ci-chave-so-para-verificacao-${{ github.run_id }}-nao-usar-em-producao
          ALLOWED_HOSTS: exemplo.test
          CORS_ALLOWED_ORIGINS: https://exemplo.test
        run: python manage.py check --deploy --fail-level ERROR

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: testes

    steps:
      - uses: actions/checkout@v4

      # A mesma imagem que o servidor (EC2) monta no deploy.
      - name: Montar a imagem
        run: docker build -t comprafacil-api:ci .
