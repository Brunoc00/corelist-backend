# Produção numa máquina só (EC2): PostgreSQL + backend + Caddy (HTTPS).
#
# Na pasta deploy/ do servidor:
#   cp .env.example .env   # e preencha (o compose lê o .env sozinho)
#   docker compose up -d --build
#
# Caddy pega o certificado HTTPS sozinho (Let's Encrypt) para o DOMINIO.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - dados_caddy:/data
      - config_caddy:/config
    depends_on:
      - api

volumes:
  dados_postgres:
  dados_caddy:
  config_caddy:
